name: Tests

# Public-repo posture: no pull_request_target, no self-hosted runners, no secrets.
on:
  push:
    branches: ['*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    name: CI — office (fe-user)
    runs-on: ubuntu-latest
    steps:
      - name: Clone vbwd-fe-user
        uses: actions/checkout@v4
        with:
          repository: VBWD-platform/vbwd-fe-user
          ref: main
          path: app
          submodules: recursive

      - name: Clone plugin
        uses: actions/checkout@v4
        with:
          path: app/plugins/office

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install
        working-directory: app
        run: npm ci

      # NOTE: the Docs editor's Tiptap dependencies are declared by the HOST APP
      # (vbwd-fe-user's package.json), so `npm ci` above installs them. This job
      # briefly installed them explicitly, as a workaround for the period when
      # they existed only in one working tree; that workaround is gone now the
      # app repo owns them, because two places declaring one dependency is two
      # places to drift.

      - name: Unit tests
        working-directory: app
        run: npx vitest run plugins/office/

      # NOTE: no project-wide `vue-tsc --noEmit` here, deliberately. Per-plugin
      # CI clones ONLY this plugin, so a whole-project typecheck fails on
      # unrelated plugins' cross-plugin imports (dataset → cms-admin, etc.) —
      # noise that says nothing about this plugin. The full typecheck belongs to
      # the app repo's own CI, where every plugin is present.
