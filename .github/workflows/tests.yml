name: Tests

# Public-repo posture: no pull_request_target, no self-hosted runners, no secrets.
on:
  push:
    branches: ['*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    name: CI — office (fe-user)
    runs-on: ubuntu-latest
    steps:
      - name: Clone vbwd-fe-user
        uses: actions/checkout@v4
        with:
          repository: VBWD-platform/vbwd-fe-user
          ref: main
          path: app
          submodules: recursive

      - name: Clone plugin
        uses: actions/checkout@v4
        with:
          path: app/plugins/office

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install
        working-directory: app
        run: npm ci

      # This plugin's OWN runtime dependencies — the fe-user analogue of a
      # backend plugin shipping its own requirements.txt. The Docs editor is
      # built on Tiptap, which the host app does not depend on for its own sake,
      # so a per-plugin CI that clones the app at `main` would fail to resolve
      # them. Keep in step with the host app's package.json.
      - name: Install plugin runtime dependencies (VBWD Docs editor)
        working-directory: app
        run: |
          npm install --no-save --no-audit --no-fund \
            @tiptap/vue-3@^3.29.2 \
            @tiptap/pm@^3.29.2 \
            @tiptap/starter-kit@^3.29.2 \
            @tiptap/extension-image@^3.29.2

      - name: Unit tests
        working-directory: app
        run: npx vitest run plugins/office/

      # NOTE: no project-wide `vue-tsc --noEmit` here, deliberately. Per-plugin
      # CI clones ONLY this plugin, so a whole-project typecheck fails on
      # unrelated plugins' cross-plugin imports (dataset → cms-admin, etc.) —
      # noise that says nothing about this plugin. The full typecheck belongs to
      # the app repo's own CI, where every plugin is present.
